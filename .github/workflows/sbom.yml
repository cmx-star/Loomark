name: Release SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: loomark.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: loomark-sbom
          path: loomark.spdx.json
