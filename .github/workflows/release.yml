name: Release Bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: arm64
            runner: macos-14
          - platform: Linux
            arch: x64
            runner: ubuntu-latest
          - platform: Windows
            arch: x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Linux package prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm electron:make -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: loomark-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/**
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Loomark ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-assets/**/*
