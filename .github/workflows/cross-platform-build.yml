name: cross-platform-build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle_mathjax: ON
            archive_name: loomark-macos.dmg
          - os: ubuntu-24.04
            bundle_mathjax: ON
            archive_name: loomark-linux.deb
          - os: windows-2022
            qt_arch: win64_msvc2022_64
            bundle_mathjax: ON
            archive_name: loomark-windows-setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-svg-dev libgl1-mesa-dev

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: choco install ninja innosetup --yes --no-progress

      - name: Install Qt
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          target: desktop
          archives: qtbase qtsvg
          cache: true

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          target: desktop
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qtsvg
          cache: true

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DMQT_BUNDLE_MATHJAX_RUNTIME=${{ matrix.bundle_mathjax }}

      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Annotate Unix build failure
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            exit 0
          fi
          grep -E 'FAILED:|fatal error:| error:|undefined reference|ninja:' build.log \
            | head -50 \
            | while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                echo "::error title=Build failure::$line"
              done

      - name: Annotate Windows build failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path build.log)) {
            exit 0
          }
          Select-String -Path build.log -Pattern 'FAILED:', 'fatal error:', ' error:', 'undefined reference', 'ninja:' |
            Select-Object -First 50 |
            ForEach-Object {
              $line = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Build failure::$line"
            }

      - name: Test Unix
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Test Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$PWD/package"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake --install build --prefix "$package_dir"
            macdeployqt_path="$(command -v macdeployqt || true)"
            if [ -z "$macdeployqt_path" ] && [ -n "${QT_ROOT_DIR:-}" ]; then
              macdeployqt_path="$QT_ROOT_DIR/bin/macdeployqt"
            fi
            if [ ! -x "$macdeployqt_path" ]; then
              echo "macdeployqt was not found."
              exit 1
            fi

            "$macdeployqt_path" "$package_dir/Loomark.app" -verbose=2
            otool -L "$package_dir/Loomark.app/Contents/MacOS/Loomark" | tee macos-deps.txt
            if grep -E '/opt/homebrew|/Users/runner|/Qt/.*/(lib|Frameworks)/Qt' macos-deps.txt; then
              echo "macOS app still references external Qt framework paths."
              exit 1
            fi
            dmg_root="$PWD/dmg-root"
            rm -rf "$dmg_root"
            mkdir -p "$dmg_root"
            cp -R "$package_dir/Loomark.app" "$dmg_root/"
            ln -s /Applications "$dmg_root/Applications"
            hdiutil create \
              -volname "Loomark" \
              -srcfolder "$dmg_root" \
              -ov \
              -format UDZO \
              "$PWD/${{ matrix.archive_name }}"
          else
            cmake --install build --prefix "$package_dir/usr"
            ldd "$package_dir/usr/bin/markdown_qt_gui" | tee linux-deps.txt
            if grep -F "not found" linux-deps.txt; then
              echo "Linux package has unresolved shared library dependencies."
              exit 1
            fi
            ln -s markdown_qt_gui "$package_dir/usr/bin/loomark"
            mkdir -p "$package_dir/usr/share/applications"
            printf '%s\n' \
              '[Desktop Entry]' \
              'Type=Application' \
              'Name=Loomark' \
              'Comment=Native Markdown editor' \
              'Exec=loomark' \
              'Terminal=false' \
              'Categories=Office;TextEditor;' \
              > "$package_dir/usr/share/applications/loomark.desktop"

            package_version="${GITHUB_REF_NAME#v}"
            if [ "$package_version" = "$GITHUB_REF_NAME" ]; then
              package_version="0.1.0~ci"
            fi
            package_arch="$(dpkg --print-architecture)"
            mkdir -p "$package_dir/DEBIAN"
            printf '%s\n' \
              'Package: loomark' \
              "Version: $package_version" \
              'Section: editors' \
              'Priority: optional' \
              "Architecture: $package_arch" \
              'Maintainer: Loomark Maintainers <noreply@example.com>' \
              'Depends: libc6, libstdc++6, libgcc-s1, libgl1, libqt6core6t64 | libqt6core6, libqt6gui6, libqt6widgets6, libqt6svg6, nodejs' \
              'Description: Native large-file Markdown editor prototype' \
              ' Loomark is a native Qt Markdown editor prototype with local editing and preview.' \
              > "$package_dir/DEBIAN/control"
            dpkg-deb --root-owner-group --build "$package_dir" "$PWD/${{ matrix.archive_name }}"
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'package'
          cmake --install build --prefix $packageDir
          $guiExe = Join-Path $packageDir 'bin\Loomark.exe'
          if (!(Test-Path $guiExe)) {
            Write-Error "GUI executable was not installed at $guiExe"
            exit 1
          }

          $deployCommand = Get-Command windeployqt -ErrorAction SilentlyContinue
          $deployPath = if ($deployCommand) { $deployCommand.Source } else { Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe' }
          if (!(Test-Path $deployPath)) {
            Write-Error "windeployqt was not found."
            exit 1
          }

          & $deployPath --release --compiler-runtime $guiExe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $requiredPaths = @(
            'bin\Qt6Core.dll',
            'bin\Qt6Gui.dll',
            'bin\Qt6Widgets.dll',
            'bin\Qt6Svg.dll',
            'bin\platforms\qwindows.dll'
          )
          foreach ($path in $requiredPaths) {
            $fullPath = Join-Path $packageDir $path
            if (!(Test-Path $fullPath)) {
              Write-Error "Windows package is missing $path"
              exit 1
            }
          }

          $packageVersion = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0-ci' }
          $isccCommand = Get-Command iscc -ErrorAction SilentlyContinue
          if (!$isccCommand) {
            Write-Error "Inno Setup compiler iscc was not found."
            exit 1
          }

          & $isccCommand.Source `
            "/DSourceDir=$packageDir" `
            "/DOutputDir=$PWD" `
            "/DMyAppVersion=$packageVersion" `
            (Join-Path $PWD 'packaging\windows\loomark.iss')
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $installer = Join-Path $PWD '${{ matrix.archive_name }}'
          if (!(Test-Path $installer)) {
            Write-Error "Windows installer was not created at $installer"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: loomark-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail

          publish_release() {
            shopt -s nullglob
            files=(dist/*)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No release artifacts found in dist/."
              return 1
            fi

            echo "Release files:"
            ls -lah dist

            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists."
            else
              gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$GITHUB_REF_NAME" \
                --generate-notes || return $?
            fi

            for file in "${files[@]}"; do
              gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber || return $?
            done
          }

          set +e
          publish_release 2>&1 | tee release.log
          release_status=${PIPESTATUS[0]}
          set -e
          if [ "$release_status" -ne 0 ]; then
            tail -80 release.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Release failure::$line"
            done
            exit "$release_status"
          fi
