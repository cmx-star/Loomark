name: cross-platform-build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle_mathjax: ON
            archive_name: loomark-macos.zip
          - os: ubuntu-24.04
            bundle_mathjax: ON
            archive_name: loomark-linux.tar.gz
          - os: windows-2022
            qt_arch: win64_msvc2022_64
            bundle_mathjax: ON
            archive_name: loomark-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-svg-dev libgl1-mesa-dev

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Qt
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          target: desktop
          archives: qtbase qtsvg
          cache: true

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          target: desktop
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qtsvg
          cache: true

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DMQT_BUNDLE_MATHJAX_RUNTIME=${{ matrix.bundle_mathjax }}

      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Annotate Unix build failure
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            exit 0
          fi
          grep -E 'FAILED:|fatal error:| error:|undefined reference|ninja:' build.log \
            | head -50 \
            | while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                echo "::error title=Build failure::$line"
              done

      - name: Annotate Windows build failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path build.log)) {
            exit 0
          }
          Select-String -Path build.log -Pattern 'FAILED:', 'fatal error:', ' error:', 'undefined reference', 'ninja:' |
            Select-Object -First 50 |
            ForEach-Object {
              $line = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Build failure::$line"
            }

      - name: Test
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && '' || 'offscreen' }}
        run: ctest --test-dir build --output-on-failure

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$PWD/package"
          cmake --install build --prefix "$package_dir"
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$package_dir" "$PWD/${{ matrix.archive_name }}"
          else
            tar -C "$PWD" -czf "$PWD/${{ matrix.archive_name }}" package
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'package'
          cmake --install build --prefix $packageDir
          Compress-Archive -Path $packageDir -DestinationPath (Join-Path $PWD '${{ matrix.archive_name }}')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: loomark-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail

          publish_release() {
            shopt -s nullglob
            files=(dist/*)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No release artifacts found in dist/."
              return 1
            fi

            echo "Release files:"
            ls -lah dist

            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists."
            else
              gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$GITHUB_REF_NAME" \
                --generate-notes || return $?
            fi

            for file in "${files[@]}"; do
              gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber || return $?
            done
          }

          set +e
          publish_release 2>&1 | tee release.log
          release_status=${PIPESTATUS[0]}
          set -e
          if [ "$release_status" -ne 0 ]; then
            tail -80 release.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Release failure::$line"
            done
            exit "$release_status"
          fi
